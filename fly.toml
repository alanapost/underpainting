# Fly.io config for the members app (members.underpainting.club).
app = "underpainting-members"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "60s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# One small volume for 1:1 bookings from Tymeslot. Create once: fly volumes create data --size 1 --region sjc
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
